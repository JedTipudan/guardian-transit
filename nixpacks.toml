[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "npx prisma generate --schema=server/prisma/schema.prisma",
  "npm run build --workspace server"
]

[start]
cmd = "npx prisma migrate deploy --schema=server/prisma/schema.prisma && node server/dist/src/index.js"
